<!DOCTYPE html>

<html>
    <head>
        <style>
            h1 {
                text-align: center;
            }
        </style>

    </head>
    <body>
        
            <h1 id = "welcome-message"></h1>

        <script>
            const params = new URLSearchParams(window.location.search);

            document.getElementById("welcome-message").textContent = "Welcome, " + username + "!";


        </script>
    </body>
</html>
