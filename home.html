<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {
                text-align: center;
            }

            h2 {
                text-align: center;
                margin-top: 200px;
            }

            label {
                margin-left: 40%;
            }

            .center {
                text-align: center;
                margin-top: 20px;
            }
                
            </style>
    </head>
    <body>
        <h1>My Project</h1>
        <h2>Login</h2>
        <form action = "/login" method = "post">
            <label>Username:</label>
            <input type="text" name = "username" required><br><br>
            <label>Password:</label>
            <input type="password" name = "password" required><br><br>
            <div class = "center">
                <button class = "login-button" type = "submit">Login Now!</button>
            </div>
        </form>
        <form action = "/register" method = "get">
            <div class = "center">
                <button type = "submit">Don't have an account? Register here!</button>
            </div>
        </form>
        
        
        
    </body>
</html>
