<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {
                text-align: center;
            }

            h2 {
                text-align: center;
                margin-top: 200px;
            }

            label {
                margin-left: 40%;
            }

            .center {
                text-align: center;
                margin-top: 20px;
            }

            .login-error {
                text-align: center;
                margin-top: 1px;
            }
                
            </style>
    </head>
    <body>
        <h1>Job Application tracker</h1>
        <p style = "text-align: center;">Create by Yirui Dong</p>
        <h2>Login</h2>
        <form action = "/login" method = "post">
            <label>Username:</label>
            <input type="text" name = "username" required><br><br>
            <label>Password:</label>
            <input type="password" name = "password" required><br><br>
            <p class = "login-error" id = "login-Error"></p>
            <div class = "center">
                <button class = "login-button" type = "submit">Login Now!</button>
            </div>
        </form>
        <form action = "/register" method = "get">
            <div class = "center">
                <button type = "submit">Don't have an account? Register here!</button>
            </div>
        </form>
        <script>
            const params = new URLSearchParams(window.location.search);
            const loginError = params.get("loginError");

            if (loginError) {
                document.getElementById("login-Error").textContent = loginError;
            }
        </script>
        
        
        
    </body>
</html>
